# yolov8_twohead.yaml ─ YOLOv8 with separate heads for Player & Ball
# Ultralytics 🚀 AGPL‑3.0

# 1. Global params
nc: 2           # TOTAL classes (ball=0, player=1)  ← changed
names: [ball, player]  # class names
scales: # model compound scaling constants, i.e. 'model=yolov8n_football.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024] # YOLOv8n summary: 129 layers, 3157200 parameters, 3157184 gradients, 8.9 GFLOPS
  s: [0.33, 0.50, 1024] # YOLOv8s summary: 129 layers, 11166560 parameters, 11166544 gradients, 28.8 GFLOPS
  m: [0.67, 0.75, 768] # YOLOv8m summary: 169 layers, 25902640 parameters, 25902624 gradients, 79.3 GFLOPS
  l: [1.00, 1.00, 512] # YOLOv8l summary: 209 layers, 43691520 parameters, 43691504 gradients, 165.7 GFLOPS
  x: [1.00, 1.25, 512] # YOLOv8x summary: 209 layers, 68229648 parameters, 68229632 gradients, 258.5 GFLOPS

# YOLOv8.0n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]          # 0‑P1/2
  - [-1, 1, Conv, [128, 3, 2]]         # 1‑P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]         # 3‑P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]         # 5‑P4/16
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]        # 7‑P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]           # 9

# 3. Neck + Heads
head:
  # FPN/PAN neck (unchanged)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]                # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]                # 15 (P3/8)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]                # 18 (P4/16)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]               # 21 (P5/32)

  # take early backbone feature (layer 2 = P2/4, 128 ch)
  - [2,   1, Conv, [128, 1, 1]]         # 22  shrink channels
  - [-1,  1, C2f, [128]]                # 23  refine P2
  # upsample deeper context and concat (optional):
  - [15,  1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 23], 1, Concat, [1]]          # 25 fuse P2 & P3

  # Dual Detect heads
  - [[25], 1, Detect, [1]]              # 26 ball-only P2 head
  - [[15, 18, 21], 1, Detect, [1]]      # 27 PLAYER
  - [[26, 27], 1, ConcatHead, [1, 1]]   # 28 ─ merges into a 2‑class tensor

  # - [[15, 18, 21], 1, Detect, [1]]     # 22 ─ Head‑A: BALL
  # - [[15, 18], 1, Detect, [1]]     # 22 ─ Head‑A: BALL use only P3/8 and P4/16
  
  # - [[15, 18, 21], 1, Detect, [1]]     # 23 ─ Head‑B: PLAYER

  # Output merger 
  # - [[22, 23], 1, ConcatHead, [1, 1]]  # 24 ─ merges into a 2‑class tensor
