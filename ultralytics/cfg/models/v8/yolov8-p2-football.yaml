# yolov8-p2-soccer.yaml  – modified for broadcast-soccer detection
# Ultralytics 🚀 AGPL-3.0 License - https://ultralytics.com/license
# Detect heads: P2/4 • P3/8 • P4/16 • P5/32 • P6/64

# -------------------------------------------------------------------
# 1. PARAMETERS
# -------------------------------------------------------------------
nc: 2          # <-- set to 2 (person, ball) – change if you have more classes
scales:        # model compound-scaling constants
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# -------------------------------------------------------------------
# 2. BACKBONE  (unchanged from the stock P2 model)
# -------------------------------------------------------------------
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]       # 0  P1/2
  - [-1, 1, Conv, [128, 3, 2]]      # 1  P2/4
  - [-1, 3, C2f, [128, True]]       # 2
  - [-1, 1, Conv, [256, 3, 2]]      # 3  P3/8
  - [-1, 6, C2f, [256, True]]       # 4
  - [-1, 1, Conv, [512, 3, 2]]      # 5  P4/16
  - [-1, 6, C2f, [512, True]]       # 6
  - [-1, 1, Conv, [1024, 3, 2]]     # 7  P5/32
  - [-1, 3, C2f, [1024, True]]      # 8
  - [-1, 1, SPPF, [1024, 5]]        # 9

# -------------------------------------------------------------------
# 3. HEAD  (P2-P6, beefed-up P2 channels)
# -------------------------------------------------------------------
head:
  # ----- upsample + merge P5→P4 -----
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 10
  - [[-1, 6], 1, Concat, [1]]                    # 11  cat backbone P4
  - [-1, 3, C2f, [512]]                          # 12

  # ----- upsample + merge P4→P3 -----
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 13
  - [[-1, 4], 1, Concat, [1]]                    # 14  cat backbone P3
  - [-1, 3, C2f, [256]]                          # 15  (P3/8)

  # ----- upsample + merge P3→P2 -----
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 16
  - [[-1, 2], 1, Concat, [1]]                    # 17  cat backbone P2
  - [-1, 3, C2f, [192]]                          # 18  (P2/4)  ← widened from 128→192

  # ----- downsample P2→P3 -----
  - [-1, 1, Conv, [128, 3, 2]]                   # 19
  - [[-1, 15], 1, Concat, [1]]                   # 20  cat head P3
  - [-1, 3, C2f, [256]]                          # 21  (P3/8)

  # ----- downsample P3→P4 -----
  - [-1, 1, Conv, [256, 3, 2]]                   # 22
  - [[-1, 12], 1, Concat, [1]]                   # 23  cat head P4
  - [-1, 3, C2f, [512]]                          # 24  (P4/16)

  # ----- downsample P4→P5 -----
  - [-1, 1, Conv, [512, 3, 2]]                   # 25
  - [[-1, 9], 1, Concat, [1]]                    # 26  cat head P5
  - [-1, 3, C2f, [1024]]                         # 27  (P5/32)

  # ----- *NEW* downsample P5→P6 -----
  - [-1, 1, Conv, [512, 3, 2]]                   # 28  P6/64
  - [-1, 2, C2f,  [512]]                         # 29  (P6/64)

  # ----- Detect layers ------------------------------------------------
  # Detect(P2, P3, P4, P5, P6)
  - [[18, 21, 24, 27, 29], 1, Detect, [nc]]
